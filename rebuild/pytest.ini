# M13 test runner settings (rebuild/DESIGN.md 17.6.1, 17.6.3). ASCII only.
[pytest]
testpaths = tests
addopts = -p no:cacheprovider -ra --strict-markers
markers =
    slow: takes tens of seconds or more on CPU (full data passes, two training runs, 66,315 SASRec rows, silhouette); deselect with -m "not slow"
    vessl: needs a GPU, LLM_PATH or VESSL run folders; tests/vessl/conftest.py skips them with VESSL_REQUIRED unless ILORA_VESSL=1 and CUDA is available
    criterion(*ids): completion criteria implemented by the test, e.g. criterion("M5-2") is item 2 of DESIGN.md 9.8
